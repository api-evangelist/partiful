aid: partiful
name: Partiful
description: 'Partiful is a free consumer event-invitation and party-planning platform for creating customized digital invites, managing RSVPs, coordinating guests with polls and custom questions, sending text-blast updates, selling tickets or collecting payments via a Stripe integration, and sharing event photos across web, iOS, and Android. It was surfaced as a portfolio company of Bond Capital, Canaan Partners, GV, and Initialized Capital. Partiful publishes no official public developer API or developer portal; a community-maintained reverse-engineered client library exists on GitHub but is not first-party. This profile captures the provider identity and probed domain-security posture.'
